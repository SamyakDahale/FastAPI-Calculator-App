<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Calculator</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">ACccout</button>
            <button onclick="deleteDigit()">DEL</button>
            <button class="operator" onclick="setOp('/')">÷</button>

            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="operator" onclick="setOp('*')">×</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="operator" onclick="setOp('-')">-</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="operator" onclick="setOp('+')">+</button>

            <button onclick="appendNum('0')">0</button>
            <button onclick="appendNum('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = "";
        let previousInput = "";
        let operator = null;
        let shouldResetDisplay = false;

        const display = document.getElementById('display');

        function updateDisplay() {
            display.value = currentInput || "0";
        }

        function appendNum(num) {
            if (shouldResetDisplay) {
                currentInput = "";
                shouldResetDisplay = false;
            }
            if (num === '.' && currentInput.includes('.')) return;
            if (currentInput === "0" && num !== '.') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function setOp(op) {
            if (currentInput === "") return;
            if (previousInput !== "") {
                calculate();
            }
            operator = op;
            previousInput = currentInput;
            shouldResetDisplay = true;
        }

        function clearDisplay() {
            currentInput = "";
            previousInput = "";
            operator = null;
            updateDisplay();
        }

        function deleteDigit() {
            currentInput = currentInput.toString().slice(0, -1);
            updateDisplay();
        }

        async function calculate() {
            if (previousInput === "" || currentInput === "" || operator === null) return;

            const a = parseFloat(previousInput);
            const b = parseFloat(currentInput);
            let endpoint = "";

            switch (operator) {
                case '+': endpoint = 'add'; break;
                case '-': endpoint = 'subtract'; break;
                case '*': endpoint = 'multiply'; break;
                case '/': endpoint = 'divide'; break;
            }

            try {
                const response = await fetch(`/${endpoint}?a=${a}&b=${b}`);
                const data = await response.json();

                if (response.ok) {
                    currentInput = data.result.toString();
                    operator = null;
                    previousInput = "";
                    shouldResetDisplay = true;
                    updateDisplay();
                } else {
                    alert("Error: " + (data.detail || "Unknown error"));
                    clearDisplay();
                }
            } catch (error) {
                alert("Network error: " + error);
            }
        }
    </script>

</body>

</html>
